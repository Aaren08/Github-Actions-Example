name: Advanced Context Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: "development"
      run_tests:
        description: "Run tests?"
        required: true
        default: "true"

env:
  GLOBAL_ENV: "This is a global environment variable"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      setup-message: ${{ steps.set-output.outputs.message }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print GitHub Context
        run: echo "${{ toJson(github) }}"

      - name: Print Env Context
        run: echo "${{ toJson(env) }}"

      - name: Print Vars Context
        run: echo "${{ toJson(vars) }}"

      - name: Set Custom Output
        id: set-output
        run: echo "message=Setup completed successfully" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      matrix:
        node-version: [18, 20]

    env:
      JOB_ENV: "Build Job Environment Variable"

    steps:
      - name: Print Needs Context
        run: |
          echo "Setup Output: ${{ needs.setup.outputs.setup_message }}"

      - name: Print Matrix Context
        run: |
          echo "Node Version: ${{ matrix.node-version }}"

      - name: Print Job Context
        run: echo "${{ toJson(job) }}"

      - name: Print Runner Context
        run: echo "${{ toJson(runner) }}"

      - name: Print Strategy Context
        run: echo "${{ toJson(strategy) }}"

      - name: Print Steps Context
        run: echo "${{ toJson(steps) }}"

  conditional-job:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.run_tests == 'true' || github.event_name == 'push' }}

    steps:
      - name: Print Event Name
        run: |
          echo "Event Name: ${{ github.event_name }}"

      - name: Print Workflow Inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Selected Environment: ${{ github.event.inputs.environment }}"

      - name: Use Secret (masked in logs)
        run: |
          echo "Secret length: ${#MY_SECRET}"
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}

      - name: Print Global Env
        run: |
          echo "Global Env: $GLOBAL_ENV"
